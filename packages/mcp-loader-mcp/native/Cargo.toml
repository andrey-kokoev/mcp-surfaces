[package]
name = "narada-mcp-loader"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "narada-mcp-loader"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
